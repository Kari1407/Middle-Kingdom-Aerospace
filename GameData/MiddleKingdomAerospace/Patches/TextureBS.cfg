// Can't directly tell the game to go to another folder to find a texture so we kinda do this bullshit

@PART[MKA_26*|MKA_CZ7*|MKA_CZ8*]
{
  MODULE
  {
      name = ModuleB9PartSwitch
  	  moduleID = TextureBullshit
  	  switcherDescription = Texture
  	  affectDragCubes = false
  	  affectFARVoxels = false
    
  	  SUBTYPE
  	  {
          name = Default

  	    	TEXTURE
  	    	{
  	    		texture = MiddleKingdomAerospace/Assets/Shared/MKA_METAL_BLANK
  	    	  	currentTexture = MKA_METAL_BLANK
            	shaderProperty = _MaskMap
  	    	}

  	    	TEXTURE
  	    	{
  	    		texture = MiddleKingdomAerospace/Assets/Shared/MKA_DETAIL_NRM
  	    		currentTexture = MKA_DETAIL_NRM
            	shaderProperty = _DetailBumpMap
  	    		isNormalMap = true
  	      	}
  	  }
  } 
}

@PART[MKA_CZ7_K21_YF100|MKA_CZ7_K31_YF100|MKA_26_CZ5_YF100_MOUNT]
{
 	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TextureBullshit]]
	{

    	@SUBTYPE[Default]
		{
  			TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_BASE
  				currentTexture = MKA_YF-100_BASE
    	    	shaderProperty = _MainTex
  			}
  			TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_NRM
  				currentTexture = MKA_YF-100_NRM
    	    	shaderProperty = _BumpMap
  				isNormalMap = true
  			}
  			TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_MASK
  				currentTexture = MKA_YF-100_MASK
    	    	shaderProperty = _AOMap
  			}
    	  TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_MASK
  				currentTexture = MKA_YF-100_MASK
    	    	shaderProperty = _MaskMap
  			}		
  		}
  	}
}

@PART[MKA_CZ8_FAIRING]
{
 	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TextureBullshit]]
	{

    	@SUBTYPE[Default]
		{
  			TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/CZ7/MKA_CZ_7_H3F_B_BASE
  				currentTexture = MKA_CZ_7_H3F_B_BASE
    	    	shaderProperty = _MainTex
  			}
  			TEXTURE
  			{
  				texture = MiddleKingdomAerospace/Assets/CZ7/MKA_CZ_7_H3F_B_NRM
  				currentTexture = MKA_CZ_7_H3F_B_NRM
    	    	shaderProperty = _BumpMap
  				isNormalMap = true
  			}
  		}
  	}
}