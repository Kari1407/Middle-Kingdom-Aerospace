// Patch Vents
@PART[MKA_*]:HAS[@MODULE[ModuleEngin*]:HAS[#engineID[dump]]]:NEEDS[RealismOverhaul]:AFTER[zzzRealismOverhaul]
{
	@MODULE[ModuleEngines*],*
	{
		@name = ModuleEnginesFX
        %multFlow = 20
		%overrideStagingIconIfBlank = false
		@PROPELLANT[LqdMethane]
        {
			@name = CooledLqdMethane
            @ratio = 0.48196
        }
        @PROPELLANT[Oxidizer]
        {
            @name = CooledLqdOxygen
            @ratio = 0.51804
        }
	}
}

