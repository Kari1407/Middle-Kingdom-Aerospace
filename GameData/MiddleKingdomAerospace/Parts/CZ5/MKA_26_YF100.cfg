  		    }
			TEXTURE
    	    {
				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_G_MASK
				shaderProperty = _MaskMap
  		    }
		}

		SUBTYPE
		{
			name = Silver
			title = #LOC_MKA_switcher_disabled
			primaryColor = #FFFFFF
			secondaryColor = #808080
			TEXTURE
     	    {
				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_F_BASE
				shaderProperty = _MainTex
  		    }
			TEXTURE
    	    {
				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_F_MASK
				shaderProperty = _MaskMap
  		    }
		}
	}

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = fx_yf100
        engineID = yf100
