        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        CONTROLLER
        {
            name = random
            linkedTo = random
            range = -1,1
        }
        TEMPLATE
        {
            templateName = waterfall-kerolox-lower-4
            overrideParentTransform = thrustTransform
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 1.7,1.7,1.7
        }
		TEMPLATE
        {
            templateName = waterfall-nozzle-glow-orange-1
            overrideParentTransform = thrustTransform
            position = 0,0,0
			rotation = 0, 0, 0
			scale = 0.7, 0.7, 0.7
        }
    }

	MODULE
    {
       	name = ModuleDepthMask
