	{
		name = ModuleB9PartSwitch
		moduleID = TextureSwitch
		switcherDescription = #LOC_MKA_switcher_decals
	
		SUBTYPE
		{
			name = 	Blended
			title = #LOC_MKA_switcher_enabled
			primaryColor = #808080
			secondaryColor = #FFFFFF
			defaultSubtypePriority = 1
		}

		SUBTYPE
		{
			name = Green
			title = #LOC_MKA_switcher_disabled
			primaryColor = #FFFFFF
			secondaryColor = #808080
			TEXTURE
     	    {
				texture = MiddleKingdomAerospace/Assets/Shared/MKA_YF-100_G_BASE
