	crashTolerance = 20
	maxTemp = 2000
	bulkheadProfiles = size1p675
	// autoStrutMode = Grandparent

	EFFECTS
    {
        fx_yf100
        {
            AUDIO
            {
                channel = Ship
                clip = Waterfall/Sounds/EnsouSounds/Loop_Liquid_Medium_High_2
                volume = 0.0 0.0
                volume = 0.01 0.4
                volume = 1.0 1.0
                pitch = 0.0 0.7
                pitch = 1.0 1.0
                loop = true
            }
        }
        engage
        {
            AUDIO
            {
              channel = Ship
              clip = Waterfall/Sounds/KW/sound_liq6
              volume = 0.5
              pitch = 1.0
              loop = false
            }
        }
        disengage
        {
            PREFAB_PARTICLE
            {
                prefabName = fx_exhaustSparks_flameout_2
                transformName = thrustTransform
                oneShot = true
            }
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            PREFAB_PARTICLE
            {
                prefabName = fx_exhaustSparks_flameout_2
                transformName = thrustTransform
                oneShot = true
            }
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 1.0
                pitch = 2.0
                loop = false
            }
        }
    }
	
	MODULE
	{
		name = ModuleEnginesFX
		engineID = yf100
		runningEffectName = fx_yf100
		thrustVectorTransformName = thrustTransform
		exhaustDamage = True
		exhaustDamageMultiplier = 10
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 335
		heatProduction = 130
		EngineType = LiquidFuel
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
		}
		atmosphereCurve
		{
			key = 0 335
			key = 1 300
			key = 12 0.001 0 0
		}
	}

	MODULE
	{
		name = ModuleGimbal
		gimbalTransformName = Gimbal
		gimbalRangeXP = 6
		gimbalRangeXN = 6
		gimbalRangeYP = 0
		gimbalRangeYN = 0
